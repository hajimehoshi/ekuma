name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EKUMA_TEST262: ${{ github.workspace }}/.test262
    steps:
      - name: Git
        run: |
          # The conformance tests depend on the line terminators of their sources.
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the test262 commit
        id: test262
        run: |
          commit=$(sed -n 's/^const test262Commit = "\([0-9a-f]\{40\}\)"$/\1/p' test262_test.go)
          if [ -z "$commit" ]; then
            echo "test262Commit was not found in test262_test.go"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ steps.test262.outputs.commit }}
          path: .test262

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt gives the same result on every platform, so one of them is enough.
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          # -test262.shuffle is defined only in the root package, so the other packages run separately.
          go test -v -shuffle=on -timeout 30m . -test262.shuffle=on
          go test -v -shuffle=on -timeout 30m $(go list ./... | grep -vx github.com/hajimehoshi/ekuma)

  wasm:
    name: Test WebAssembly in Chrome
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install wasmbrowsertest
        run: |
          wasmbrowsertest_version=eec8f6b3828fd793968ed35171566ab20de7b4cc
          go install github.com/agnivade/wasmbrowsertest@${wasmbrowsertest_version}
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec
          go install github.com/agnivade/wasmbrowsertest/cmd/cleanenv@${wasmbrowsertest_version}

      - name: go vet
        run: env GOOS=js GOARCH=wasm go vet ./...

      - name: go test
        env:
          # A zone with daylight saving time, so that TestDateHostTimeZone compares offset changes with Chrome.
          TZ: America/Los_Angeles
        run: |
          # Disable AppArmor for Ubuntu 23.10+.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          # Large environment variables are removed since they are passed to the browser.
          # Chrome sometimes fails to start in time ("websocket url timeout reached"), so the tests are retried.
          max_attempts=3
          for i in $(seq 1 $max_attempts); do
            env GOOS=js GOARCH=wasm cleanenv -remove-prefix GITHUB_ -remove-prefix JAVA_ -remove-prefix PSModulePath -remove-prefix STATS_ -remove-prefix RUNNER_ -- go test -v -shuffle=on -timeout 30m ./... && break
            if [ $i -eq $max_attempts ]; then
              echo "All $max_attempts attempts failed."
              exit 1
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
