name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EKUMA_ICU: ${{ github.workspace }}/.icu
      EKUMA_ICU_CLDR: ${{ github.workspace }}/.icu-cldr
      EKUMA_TEST262: ${{ github.workspace }}/.test262
      EKUMA_V8: ${{ github.workspace }}/.v8
    steps:
      - name: Git
        run: |
          # The conformance tests depend on the line terminators of their sources.
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the test suite revisions
        id: suites
        run: |
          for file in internal/{icutest,jstest}/testdata/*-revision.txt; do
            name=${file##*/}
            suite=${name%-revision.txt}
            revision=$(cat "$file")
            if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
              echo "Expected a commit SHA in $file"
              exit 1
            fi
            echo "$suite=$revision" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout ICU conformance tests
        uses: actions/checkout@v4
        with:
          repository: unicode-org/icu
          ref: ${{ steps.suites.outputs.icu }}
          path: .icu
          sparse-checkout: |
            /LICENSE
            /icu4c/source/test/testdata/GraphemeBreakTest.txt
            /icu4c/source/test/testdata/WordBreakTest.txt
            /icu4c/source/test/testdata/SentenceBreakTest.txt
            /icu4c/source/test/testdata/casing.txt
            /icu4c/source/test/testdata/rbbitst.txt
            /icu4c/source/data/unidata/UnicodeData.txt
            /icu4c/source/data/unidata/SpecialCasing.txt
            /icu4c/source/data/unidata/CaseFolding.txt
            /icu4c/source/data/unidata/emoji-sequences.txt
            /icu4c/source/data/unidata/emoji-zwj-sequences.txt
            /icu4c/source/data/unidata/NormalizationTest.txt
            /icu4c/source/test/testdata/CollationTest_NON_IGNORABLE_SHORT.txt
            /icu4c/source/test/testdata/CollationTest_SHIFTED_SHORT.txt
            /icu4c/source/test/testdata/collationtest.txt
          sparse-checkout-cone-mode: false

      - name: Checkout CLDR locale and formatting tests
        uses: actions/checkout@v4
        with:
          repository: unicode-org/icu
          ref: ${{ steps.suites.outputs.icu-cldr }}
          path: .icu-cldr
          sparse-checkout: |
            /LICENSE
            /icu4c/source/test/testdata/cldr/localeIdentifiers/likelySubtags.txt
            /icu4c/source/test/testdata/cldr/localeIdentifiers/localeCanonicalization.txt
            /icu4c/source/test/testdata/cldr/localeIdentifiers/localeDisplayName.txt
            /icu4c/source/test/testdata/numberpermutationtest.txt
            /icu4c/source/test/testdata/numberformattestspecification.txt
            /icu4c/source/test/testdata/NumberFormatTestCases.txt
            /icu4c/source/test/testdata/dcfmtest.txt
            /icu4c/source/test/testdata/calendar.txt
            /icu4c/source/test/testdata/format.txt
            /icu4c/source/test/cintltst/cdateintervalformattest.c
            /icu4c/source/test/intltest/dtifmtts.cpp
            /icu4c/source/test/cintltst/unumberrangeformattertst.c
            /icu4c/source/test/intltest/numbertest_range.cpp
            /icu4c/source/test/intltest/listformattertest.cpp
            /icu4c/source/test/intltest/reldatefmttest.cpp
            /icu4c/source/test/cintltst/ulistfmttest.c
            /icu4c/source/test/cintltst/crelativedateformattest.c
            /icu4c/source/i18n/unicode/udat.h
            /icu4c/source/test/intltest/caltestdata.h
            /icu4c/source/data/misc/plurals.txt
            /icu4c/source/data/misc/pluralRanges.txt
            /icu4j/main/core/src/test/resources/com/ibm/icu/dev/test/format/NumberFormatTestCases.txt
            /icu4j/main/core/src/test/resources/com/ibm/icu/dev/test/format/plurals.txt
            /icu4j/main/common_tests/src/test/java/com/ibm/icu/dev/test/number/NumberRangeFormatterTest.java
            /icu4j/main/common_tests/src/test/java/com/ibm/icu/dev/test/format/PluralRangesTest.java
            /icu4j/main/core/src/test/java/com/ibm/icu/dev/test/format/ListFormatterTest.java
            /icu4j/main/core/src/test/java/com/ibm/icu/dev/test/format/RelativeDateTimeFormatterTest.java
          sparse-checkout-cone-mode: false

      - name: Checkout test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: ${{ steps.suites.outputs.test262 }}
          path: .test262

      - name: Checkout V8 test suites
        uses: actions/checkout@v4
        with:
          repository: v8/v8
          ref: ${{ steps.suites.outputs.v8 }}
          path: .v8
          sparse-checkout: |
            /DEPS
            /test/intl/
            /test/mjsunit/
            /test/mozilla/
            /test/test262/local-tests/test/
            /test/webkit/
            /tools/**/*.mjs
            /tools/clusterfuzz/js_fuzzer/resources/differential_fuzz_library.js
          sparse-checkout-cone-mode: false

      - name: Checkout Mozilla test data
        run: bash internal/jstest/checkout-mozilla.sh "$EKUMA_V8"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt gives the same result on every platform, so one of them is enough.
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          # Only the root package's tests use the suite flags.
          go test -v -shuffle=on -timeout 30m . -test262.shuffle=on -v8.shuffle=on
          go test -v -shuffle=on -timeout 30m $(go list ./... | grep -vx github.com/hajimehoshi/ekuma)

      - name: go vet (386)
        # The amd64 runners run 386 binaries natively. macOS has no 32-bit target.
        if: runner.os != 'macOS'
        run: env GOARCH=386 go vet ./...

      - name: go test (386)
        if: runner.os != 'macOS'
        run: |
          env GOARCH=386 go test -v -shuffle=on -timeout 30m . -test262.shuffle=on -v8.shuffle=on
          env GOARCH=386 go test -v -shuffle=on -timeout 30m $(go list ./... | grep -vx github.com/hajimehoshi/ekuma)

  wasm:
    name: Test WebAssembly in Chrome
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install wasmbrowsertest
        run: |
          wasmbrowsertest_version=eec8f6b3828fd793968ed35171566ab20de7b4cc
          go install github.com/agnivade/wasmbrowsertest@${wasmbrowsertest_version}
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec
          go install github.com/agnivade/wasmbrowsertest/cmd/cleanenv@${wasmbrowsertest_version}

      - name: go vet
        run: env GOOS=js GOARCH=wasm go vet ./...

      - name: go test
        env:
          # A zone with daylight saving time, so that TestDateHostTimeZone compares offset changes with Chrome.
          TZ: America/Los_Angeles
        run: |
          # Disable AppArmor for Ubuntu 23.10+.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          # Large environment variables are removed since they are passed to the browser.
          # Chrome sometimes fails to start in time ("websocket url timeout reached"), so the tests are retried.
          max_attempts=3
          for i in $(seq 1 $max_attempts); do
            env GOOS=js GOARCH=wasm cleanenv -remove-prefix GITHUB_ -remove-prefix JAVA_ -remove-prefix PSModulePath -remove-prefix STATS_ -remove-prefix RUNNER_ -- go test -v -shuffle=on -timeout 30m ./... && break
            if [ $i -eq $max_attempts ]; then
              echo "All $max_attempts attempts failed."
              exit 1
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
